name: Build Admin App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle

jobs:
  build-android:
    name: 📱 Build Admin App (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: 🐦 Setup Flutter 3.32.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true
          
      - name: 🔧 Disable Flutter Analytics
        run: flutter config --no-analytics
      - name: 📦 Install Melos
        run: dart pub global activate melos 2.9.0
        
      - name: 🧹 Clean All Packages
        run: |
          cd packages/apps/user_app && flutter clean
          cd ../admin_app && flutter clean
          cd ../attendant_app && flutter clean
        
      - name: 🔍 Flutter Doctor
        run: flutter doctor -v
        
      - name: 📱 Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
        
      - name: 🔗 Fix AndroidManifest Paths
        run: |
          cd packages/apps/user_app/android && ln -sf app/src/main/AndroidManifest.xml AndroidManifest.xml
          cd ../../admin_app/android && ln -sf app/src/main/AndroidManifest.xml AndroidManifest.xml
          cd ../../attendant_app/android && ln -sf app/src/main/AndroidManifest.xml AndroidManifest.xml
        
      - name: 🔧 Bootstrap Monorepo
        run: melos bootstrap
        
      - name: 🔐 Create .env File
        working-directory: packages/apps/admin_app
        run: |
          cat > .env << EOF
          # Appwrite Configuration
          APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}
          
          # Mapbox Configuration
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_STYLE_URL=mapbox://styles/mapbox/streets-v12
          USE_MAPBOX=true
          
          # Chapa Payment (Test Mode)
          CHAPA_SECRET_KEY_TEST=${{ secrets.CHAPA_SECRET_KEY_TEST }}
          CHAPA_PUBLIC_KEY_TEST=${{ secrets.CHAPA_PUBLIC_KEY_TEST }}
          
          # App Configuration
          APP_NAME=ParkMe+
          ENVIRONMENT=production
          DEBUG_MODE=false
          EOF
          
      - name: 🏗️ Build APK (Simple & Reliable)
        if: github.event.inputs.build_type == 'apk'
        working-directory: packages/apps/admin_app
        timeout-minutes: 60
        env:
          GRADLE_OPTS: -Xmx6144m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC
        run: |
          flutter pub get
          echo "🏗️ Building APK with verbose Gradle output..."
          flutter build apk --release -v 2>&1 | tee build.log
          BUILD_EXIT_CODE=$?
          
          echo ""
          echo "🔍 Searching for APK files in all possible locations..."
          echo "========================================================"
          
          # Search in all possible locations
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found with find command"
          
          # Check specific directories
          echo ""
          echo "📂 Checking build/app/outputs/flutter-apk/:"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Directory does not exist"
          
          echo ""
          echo "📂 Checking android/app/build/outputs/apk/release/:"
          ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "Directory does not exist"
          
          echo ""
          echo "📂 Checking android/app/build/outputs/:"
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "Directory does not exist"
          
          # If build failed, show logs
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌❌❌ BUILD FAILED ❌❌❌"
            echo "Last 200 lines of build output:"
            echo "================================"
            tail -200 build.log
            exit 1
          fi
          
          # Copy APK to expected location if found elsewhere
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo ""
            echo "✅ Found APK in android/app/build/outputs/apk/release/"
            echo "📦 Copying to expected location..."
            mkdir -p build/app/outputs/flutter-apk/
            cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          fi
        
      - name: 🏗️ Build App Bundle
        if: github.event.inputs.build_type == 'appbundle'
        working-directory: packages/apps/admin_app
        run: |
          flutter pub get
          flutter build appbundle --release
        
      - name: 📦 Upload APK Artifacts
        if: github.event.inputs.build_type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-release
          path: packages/apps/admin_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
      - name: 📦 Upload AAB Artifact
        if: github.event.inputs.build_type == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-aab
          path: packages/apps/admin_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          
      - name: 📊 Build Summary
        run: |
          echo "### 🎉 Admin App Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Flutter:** 3.32.5" >> $GITHUB_STEP_SUMMARY
          echo "**APK Type:** Universal (works on all devices)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download artifacts from the Artifacts section below" >> $GITHUB_STEP_SUMMARY
