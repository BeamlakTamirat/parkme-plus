name: shared
description: Shared models, services, and utilities for WePark applications
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Firebase Backend Services (Working versions)
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.7.4
  
  # HTTP and API
  http: ^1.1.0
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.4.0
  crypto: ^3.0.3
  
  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.1
  
  # Device & Permissions
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  
  # Image handling
  cached_network_image: ^3.3.1
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Local notifications
  flutter_local_notifications: ^17.1.2
  
  # URL launcher
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.10.0

flutter: 