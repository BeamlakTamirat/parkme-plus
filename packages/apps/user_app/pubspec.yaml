name: user_app
description: WePark User Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Shared Package
  shared:
    path: ../../shared
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.1.4
  
  # UI & Animations
  cupertino_icons: ^1.0.6
  
  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.1
  
  # Image & Media
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1
  
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
