name: user_app
description: ParkMePlus User App - Simple Version
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Shared Package
  shared:
    path: ../../shared
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.1.4
  
  # UI
  cupertino_icons: ^1.0.6

  # QR Code Generation
  qr_flutter: ^4.1.0

  # Location Services
  geolocator: ^10.1.0

  # URL Launcher for external apps
  url_launcher: ^6.2.5

  # WebView for in-app payment
  webview_flutter: ^4.4.2

  # PDF generation and file operations
  pdf: ^3.10.7
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env # Added this line to include .env as an asset