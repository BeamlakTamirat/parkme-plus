name: attendant_app
description: "WePark Attendant App - Core functionality for parking attendants"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Shared package with all business logic
  shared:
    path: ../../shared
  
  # State management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.1.4
  
  # QR Code scanning
  mobile_scanner: ^5.0.0
  permission_handler: ^11.3.0
  
  # UI utilities
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    # - assets/images/  # Commented out - empty directory
    - .env

