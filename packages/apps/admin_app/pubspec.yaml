name: admin_app
description: "WePark Admin App - Core functionality for system administration"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Shared package with all business logic
  shared:
    path: ../../shared
  
  # State management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^12.1.3
  
  # UI utilities
  cupertino_icons: ^1.0.2
  
  # 📸 Image picking
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env  # 🔑 CRITICAL: Include .env file as asset
    